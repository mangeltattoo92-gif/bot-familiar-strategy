<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aceptar Términos — Bot Familiar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0b0d12">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark">FAM</div>
    <h1>Términos actualizados</h1>
    <p class="muted small">Tenés que aceptar la versión más reciente para seguir usando Bot Familiar</p>
    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}
    <p class="small" style="text-align:left; margin-top:1.2rem;">
      Actualizamos los Términos y Condiciones / Aviso de Riesgo. Leelos completos acá:
      <a href="{{ url_for('terms') }}" target="_blank">{{ url_for('terms') }}</a>
      (se abre en una pestaña nueva).
    </p>
    <form method="post" action="{{ url_for('accept_terms') }}">
      <label style="display:flex; align-items:flex-start; gap:0.5rem; font-weight:400; cursor:pointer; margin-top:1.2rem; text-align:left;">
        <input type="checkbox" name="terms_accepted" required style="margin-top:0.2rem; flex-shrink:0;">
        <span>Leí y acepto los <a href="{{ url_for('terms') }}" target="_blank">Términos y Condiciones y el Aviso de Riesgo</a>. Entiendo que esta herramienta no da asesoría financiera y que opero bajo mi propia responsabilidad.</span>
      </label>
      <button type="submit">Aceptar y continuar</button>
    </form>
    <p class="muted small" style="margin-top:1rem;text-align:center;">
      <a href="{{ url_for('logout') }}">Salir sin aceptar</a>
    </p>
  </div>
</body>
</html>
